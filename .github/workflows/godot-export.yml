name: Godot Web Export + Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Setup Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cd ~/.local/share/godot/export_templates
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q Godot_v4.7.1-stable_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v4.7.1-stable_export_templates.tpz

      - name: Import + Build Web
        run: |
          cp export_presets_ci.cfg export_presets.cfg
          mkdir -p build/web
          godot --headless --import 2>&1 | tail -5
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tail -5
          ls -la build/web/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
