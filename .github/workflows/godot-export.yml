name: Godot Web Export + Deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  export-web:
    name: Web Export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps + Godot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip wget libegl1 libgl1 libopengl0
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable
          cd ~/.local/share/godot/export_templates/4.7.1.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          unzip -q Godot_v4.7.1-stable_export_templates.tpz
          mv templates/* .
          rm -rf templates Godot_v4.7.1-stable_export_templates.tpz
          ls -la | head -5

      - name: Import + Build Web
        run: |
          cp export_presets_ci.cfg export_presets.cfg
          mkdir -p build/web
          godot --headless --import 2>&1 | tail -3
          godot --headless --export-release "Web" build/web/index.html 2>&1 | tail -10
          ls -la build/web/ | head -10

      - name: Deploy to GitHub Pages
        run: |
          # Manueller Deploy auf gh-pages (robuster als peaceiris bei Remote-Problemen)
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan gh-pages
          git rm -rf . 2>/dev/null || true
          cp -r build/web/* .
          touch .nojekyll
          git add -A
          git commit -m "deploy: ${{ github.sha }}" --allow-empty
          git push origin gh-pages --force
          echo "✅ Deployed auf gh-pages"
